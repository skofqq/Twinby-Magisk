plugins {
    id 'com.android.application'
}

android {
    namespace 'com.twinby.adblock'
    compileSdk 34

    defaultConfig {
        applicationId "com.twinby.adblock"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API: присутствует только при компиляции, в APK не входит
    compileOnly 'de.robv.android.xposed:api:82'
}
