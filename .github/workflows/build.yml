name: Build module

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n module/*.sh module/META-INF/com/google/android/update-binary
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: twinby-adblock
          path: out/*.zip
